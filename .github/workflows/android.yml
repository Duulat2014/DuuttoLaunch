name: Build DuutLauncher

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY || 'DUMMY' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          ./gradlew jre_lwjgl3glfw:build --no-daemon
      - name: Build debug APK (arm64)
        run: ./gradlew ZalithLauncher:assembleDebug -Darch=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: DuutLauncher-arm64p
          path: ZalithLauncher/build/outputs/apk/debug/*
